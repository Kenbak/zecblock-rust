# Installed over /etc/grafana/grafana.ini on the monitor (unset keys keep Grafana defaults).
# Grafana listens on loopback only; reach it with an SSH tunnel (README).
# Admin password comes from /etc/zecblock-monitor/grafana.env (GF_SECURITY_ADMIN_PASSWORD),
# never from this file.
[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/

[paths]
provisioning = /etc/zecblock-monitor/grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
disable_gravatar = true
cookie_secure = false
cookie_samesite = strict
disable_initial_admin_creation = false

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[snapshots]
external_enabled = false

[news]
news_feed_enabled = false

# Alerting is Prometheus + Alertmanager. Grafana-managed alert rules are not used;
# the Alertmanager datasource only lets the dashboard list firing alerts.

[log]
mode = console
level = warn
