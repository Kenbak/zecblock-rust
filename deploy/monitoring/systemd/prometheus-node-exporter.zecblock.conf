# Drop-in: /etc/systemd/system/prometheus-node-exporter.service.d/zecblock.conf
# node_exporter binds the host's WireGuard address, so wg0 must be up first.
# If wg0 is down the bind fails and systemd retries; HostDown alerts meanwhile.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
