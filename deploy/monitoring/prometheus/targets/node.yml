# node_exporter targets, scraped over WireGuard (10.77.0.0/24) only.
#
# WireGuard addresses below are the PROPOSED monitoring address plan
# (README "Address plan"). Only 10.77.0.1 (primary hub) is fixed by the
# observer kit. A host is added here only after its WireGuard peer to the
# monitor (10.77.0.2) is up and node_exporter listens on its wg address.
# Comment a target out rather than leaving a host that does not exist yet:
# every listed target that does not answer pages as HostDown.
#
# Labels: host = stable fleet name (never reused), role, provider, region.
# No public IPs here: instance is the WireGuard address.
- targets: ['10.77.0.1:9100']
  labels: {host: primary, role: mainnet-primary, provider: hetzner, region: hel1}
- targets: ['10.77.0.3:9100']
  labels: {host: standby, role: mainnet-standby, provider: hetzner, region: hel1}
- targets: ['10.77.0.4:9100']
  labels: {host: testnet, role: testnet, provider: hetzner, region: hel1}
- targets: ['10.77.0.5:9100']
  labels: {host: analytics, role: analytics, provider: hetzner, region: hel1}
- targets: ['10.77.0.6:9100']
  labels: {host: crosslink, role: crosslink, provider: digitalocean, region: unknown}
- targets: ['10.77.0.7:9100']
  labels: {host: cipherpay-mainnet, role: cipherpay, provider: digitalocean, region: unknown}
- targets: ['10.77.0.8:9100']
  labels: {host: cipherpay-testnet, role: cipherpay, provider: digitalocean, region: unknown}
- targets: ['10.77.0.9:9100']
  labels: {host: shopify, role: cipherpay, provider: digitalocean, region: unknown}
- targets: ['10.77.0.11:9100']
  labels: {host: do-nyc3, role: observer, provider: digitalocean, region: nyc3}
- targets: ['10.77.0.12:9100']
  labels: {host: do-sgp1, role: observer, provider: digitalocean, region: sgp1}
- targets: ['10.77.0.13:9100']
  labels: {host: do-syd1, role: observer, provider: digitalocean, region: syd1}
