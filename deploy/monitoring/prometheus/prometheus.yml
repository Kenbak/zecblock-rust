# ZecBlock private fleet monitoring — Prometheus.
# Installed at /etc/zecblock-monitor/prometheus/prometheus.yml on the monitor.
# Listens on 127.0.0.1:9090 only (see systemd/zecblock-prometheus.service).
#
# Privacy: scrape aggregated host/service metrics over WireGuard only. Never add
# exporters that carry request logs, client IPs, RPC/PIR queries or addresses.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: zecblock-fleet

rule_files:
  - /etc/zecblock-monitor/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels: {host: monitor}

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
        labels: {host: monitor}

  - job_name: node-monitor
    # The monitor's own node_exporter, on loopback.
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {host: monitor, role: monitor, provider: digitalocean, region: fra1}

  - job_name: node
    # Includes the textfile collector output written by
    # zecblock-host-textfile.py (CVE nft counters, reboot, chrony) and, on the
    # primary only, zecblock-capture-exporter.py (orphan collector + census).
    file_sd_configs:
      - files: ['/etc/zecblock-monitor/prometheus/targets/node.yml']
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.77\.0\.[0-9]+:9100'
        action: keep

  - job_name: zakura
    file_sd_configs:
      - files: ['/etc/zecblock-monitor/prometheus/targets/zakura.yml']
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.77\.0\.[0-9]+:9999'
        action: keep
