[package]
name = "cipherscan-indexer"
version = "0.1.0"
edition = "2021"
description = "Fast Rust indexer for CipherScan - reads directly from Zebra's RocksDB"
authors = ["CipherScan"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
rocksdb = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Zcash parsing, aligned with Zakura node v1.5.0 (zakura-chain 8.0.0).
# This release does not certify NU7 compatibility; keep activation fixtures current.
zakura-chain = { git = "https://github.com/zakura-core/zakura", tag = "v1.5.0" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utils
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
base64 = "0.23"

# Environment
dotenvy = "0.15"

# HTTP client for RPC verification
reqwest = { version = "0.12", features = ["json"] }

# gRPC client for Zebra indexer streaming
tonic = "0.12"
prost = "0.13"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
