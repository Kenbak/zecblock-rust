name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full current-main commit approved for native production release
        required: true
        type: string
      ci_run_id:
        description: Latest successful push CI run for that exact commit
        required: true
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PRIMARY_HOST: ${{ secrets.PRIMARY_HOST }}
  STANDBY_HOST: ${{ secrets.STANDBY_HOST }}

jobs:
  deploy:
    name: Deploy to servers
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted release and select the exact tested commit
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/verify-deployment.py

      - name: Download the exact binary tested by CI
        uses: actions/download-artifact@v5
        with:
          name: cipherscan-indexer-linux-x86_64-${{ steps.release.outputs.target_sha }}-attempt-${{ steps.release.outputs.ci_run_attempt }}
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.release.outputs.ci_run_id }}

      - name: Validate deployment artifact
        run: |
          test -f artifact/cipherscan-indexer
          chmod 0755 artifact/cipherscan-indexer
          file artifact/cipherscan-indexer | tee /tmp/cipherscan-artifact-type
          grep -Eq 'ELF 64-bit.*x86-64' /tmp/cipherscan-artifact-type

      - name: Revalidate release checks before server access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE: ${{ steps.release.outputs.release }}
        run: python3 deploy/verify-deployment.py

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          ssh-keygen -F "${{ secrets.PRIMARY_HOST }}" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::PRIMARY_HOST is missing from DEPLOY_KNOWN_HOSTS"; exit 1;
          }
          ssh-keygen -F "${{ secrets.STANDBY_HOST }}" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::STANDBY_HOST is missing from DEPLOY_KNOWN_HOSTS"; exit 1;
          }
          cat > ~/.ssh/config << 'SSHEOF'
          Host primary
            HostName ${{ secrets.PRIMARY_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            LogLevel ERROR
          Host standby
            HostName ${{ secrets.STANDBY_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            LogLevel ERROR
          SSHEOF
          sed -i 's/^          //' ~/.ssh/config
          echo "SSH config written:"
          cat ~/.ssh/config

      - name: Write release transaction helper
        run: |
          cat > /tmp/cipherscan-release-transaction.sh << 'SCRIPT'
          # BEGIN RELEASE TRANSACTION
          set -euo pipefail
          action=$1 release_id=$2 target_sha=$3 role=$4
          [[ "$release_id" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$role" == primary || "$role" == standby ]]
          # SSH cancellation need not stop its remote child. Serialize complete
          # transactions so rollback cannot finish before an in-flight mutation.
          # This lock is separate from the live writer's ingestion fence.
          exec 9>/run/cipherscan-release-transaction.lock
          flock -x -w 120 9
          root=/root/cipherscan-rust
          unit=/etc/systemd/system/cipherscan-rust.service
          candidate=/tmp/cipherscan-indexer-$release_id
          state=$root/.deploy-releases/$release_id
          binary=$root/target/release/cipherscan-indexer

          check_role() {
            active_status=0 enabled_status=0
            recovery=$(sudo -u postgres psql -qtAX -v ON_ERROR_STOP=1 -c 'SELECT pg_is_in_recovery();')
            if [ "$role" = primary ]; then
              test "$recovery" = f
            else
              test "$recovery" = t
              active=$(systemctl is-active cipherscan-rust.service) || active_status=$?
              test "$active" = inactive
              test "${active_status:-0}" = 3
              enabled=$(systemctl is-enabled cipherscan-rust.service) || enabled_status=$?
              test "$enabled" = disabled
              test "${enabled_status:-0}" = 1
            fi
          }

          # Restores use a sibling file + rename: never truncate a running ELF.
          restore_file() {
            cp -a "$1" "$2.rollback-$release_id"
            mv -f "$2.rollback-$release_id" "$2"
          }
          replace_file() {
            install -m "$3" "$1" "$2.candidate-$release_id"
            # A failed/partial rename is recoverable only after a complete backup.
            touch "$state/$4.changed"
            mv -f "$2.candidate-$release_id" "$2"
          }
          cleanup_temporary() {
            rm -f "$candidate" "$binary.candidate-$release_id" "$binary.rollback-$release_id" \
              "$unit.candidate-$release_id" "$unit.rollback-$release_id"
          }

          case "$action" in
            check)
              check_role
              if [ "$role" = primary ]; then
                systemctl is-active --quiet cipherscan-rust.service
              fi
              ;;
            prepare)
              check_role
              cd "$root"
              git diff --quiet
              git diff --cached --quiet
              git fetch origin main
              test "$(git rev-parse origin/main)" = "$target_sha"
              test -f "$candidate"
              test -x "$binary"
              test -f "$unit"
              umask 077
              mkdir -p "$root/.deploy-releases"
              # Never reuse backups or mutation markers from another attempt.
              mkdir "$state"
              git rev-parse HEAD > "$state/source.previous"
              grep -Eq '^[0-9a-f]{40}$' "$state/source.previous"
              cp -a "$binary" "$state/binary.previous"
              cp -a "$unit" "$state/unit.previous"
              # All backups are complete before the first source/file mutation.
              touch "$state/source.changed"
              git reset --hard "$target_sha"
              replace_file "$candidate" "$binary" 0755 binary
              if [ "$role" = standby ]; then
                replace_file deploy/cipherscan-rust.service "$unit" 0644 unit
                systemctl daemon-reload
              fi
              touch "$state/prepared"
              rm -f "$candidate"
              ;;
            activate)
              test "$role" = primary
              test -f "$state/prepared"
              check_role
              cd "$root"
              replace_file deploy/cipherscan-rust.service "$unit" 0644 unit
              systemctl daemon-reload
              # Even a failing restart can stop the old writer and needs recovery.
              touch "$state/restart.attempted"
              systemctl restart cipherscan-rust.service
              sleep 5
              set -a
              source .env
              set +a
              systemctl is-active --quiet cipherscan-rust.service
              "$binary" health --json > "$state/health.json"
              ;;
            rollback)
              if [ -d "$state" ] && [ ! -f "$state/rollback.done" ]; then
                # Untouched hosts never consume any persistent .previous files.
                if [ -f "$state/source.changed" ] || [ -f "$state/binary.changed" ] \
                   || [ -f "$state/unit.changed" ]; then
                  check_role
                  if [ -f "$state/binary.changed" ]; then
                    restore_file "$state/binary.previous" "$binary"
                  fi
                  if [ -f "$state/unit.changed" ]; then
                    restore_file "$state/unit.previous" "$unit"
                    systemctl daemon-reload
                  fi
                  if [ -f "$state/source.changed" ]; then
                    previous=$(cat "$state/source.previous")
                    [[ "$previous" =~ ^[0-9a-f]{40}$ ]]
                    git -C "$root" reset --hard "$previous"
                  fi
                  if [ -f "$state/restart.attempted" ]; then
                    test "$role" = primary
                    systemctl restart cipherscan-rust.service
                    systemctl is-active --quiet cipherscan-rust.service
                  fi
                fi
                touch "$state/rollback.done"
              fi
              cleanup_temporary
              ;;
            *) echo 'Unknown release transaction action' >&2; exit 1 ;;
          esac
          # END RELEASE TRANSACTION
          SCRIPT
          bash -n /tmp/cipherscan-release-transaction.sh

      - name: Require expected database and passive standby roles before staging
        run: |
          for host in primary standby; do
            ssh "$host" "bash -s -- check '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' '$host'" \
              < /tmp/cipherscan-release-transaction.sh
          done

      - name: Stage tested binary on both servers
        id: stage
        run: |
          scp artifact/cipherscan-indexer "primary:/tmp/cipherscan-indexer-$RELEASE_ID"
          scp artifact/cipherscan-indexer "standby:/tmp/cipherscan-indexer-$RELEASE_ID"

      - name: Prepare candidate on primary box
        run: |
          ssh primary "bash -s -- prepare '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' primary" \
            < /tmp/cipherscan-release-transaction.sh

      - name: Prepare candidate on standby box
        run: |
          ssh standby "bash -s -- prepare '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' standby" \
            < /tmp/cipherscan-release-transaction.sh

      - name: Revalidate release checks after staging before migrations and activation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE: ${{ steps.release.outputs.release }}
        run: python3 deploy/verify-deployment.py

      - name: Recheck expected roles before migrations and activation
        run: |
          for host in primary standby; do
            ssh "$host" "bash -s -- check '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' '$host'" \
              < /tmp/cipherscan-release-transaction.sh
          done

      - name: Apply additive migrations on expected PG primary
        run: |
          ssh primary << 'REMOTE'
          set -euo pipefail
          cd /root/cipherscan-rust
          test "$(sudo -u postgres psql -qtAX -v ON_ERROR_STOP=1 -c 'SELECT pg_is_in_recovery();')" = f
          set -a
          source .env
          set +a
          DB_NAME=$(psql "$DATABASE_URL" -qtAX -v ON_ERROR_STOP=1 -c 'SELECT current_database();')
          if [[ ! "$DB_NAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "ERROR: Refusing unexpected database name" >&2
            exit 1
          fi
          # Application credentials intentionally do not own schema objects.
          # Apply backward-compatible schema expansion before activating code
          # that may depend on it. Destructive contract migrations belong in a
          # later release, after every old binary has stopped using the object.
          DATABASE_URL="dbname=$DB_NAME" MIGRATIONS_AS_POSTGRES=true bash deploy/apply-migrations.sh
          REMOTE

      - name: Activate candidate on primary box
        id: activate
        run: |
          ssh primary "bash -s -- activate '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' primary" \
            < /tmp/cipherscan-release-transaction.sh

      - name: Verify
        run: |
          echo "=== Primary indexer status ==="
          ssh primary "systemctl is-active cipherscan-rust.service && journalctl -u cipherscan-rust -n 3 --no-pager"
          echo "=== Standby remains passive ==="
          ssh standby "bash -s -- check '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' standby" \
            < /tmp/cipherscan-release-transaction.sh
          echo "=== Replication status ==="
          ssh primary "sudo -u postgres psql -c \"SELECT client_addr, state, sent_lsn, replay_lsn FROM pg_stat_replication;\"" || true

      - name: Roll back only this release's host changes on failure
        if: (failure() || cancelled()) && (steps.stage.outcome == 'success' || steps.stage.outcome == 'failure')
        run: |
          rollback_failed=0
          for host in primary standby; do
            if ! ssh "$host" "bash -s -- rollback '$RELEASE_ID' '${{ steps.release.outputs.target_sha }}' '$host'" \
                < /tmp/cipherscan-release-transaction.sh; then
              echo "::error::Rollback/temporary cleanup failed on $host; manual inspection required"
              rollback_failed=1
            fi
          done
          exit "$rollback_failed"
