name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs only; every main push and scheduled scan finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: fmt + clippy
    # Match the Ubuntu 24.04 mainnet hosts; newer build images may require newer glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (required to build the gRPC .proto files)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Test migration online-DDL checks
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --release --all-targets -- -D warnings

  build-and-test:
    name: build + test (with Postgres)
    # Match the Ubuntu 24.04 mainnet hosts; newer build images may require newer glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherscan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and postgresql-client
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Apply schema to the disposable CI database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cipherscan_ci \
            -c "CREATE ROLE zcash_user LOGIN PASSWORD 'zcash_test' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d cipherscan_ci \
            -v ON_ERROR_STOP=1 -f schema/postgres.sql

      - name: Apply and verify versioned migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cipherscan_ci
        run: |
          bash deploy/apply-migrations.sh
          output="$(bash deploy/apply-migrations.sh)"
          printf '%s\n' "$output"
          grep -q 'All migrations already applied' <<< "$output"

      - name: Run the monitoring exporter SQL against the migrated database
        env:
          MONITOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cipherscan_ci
        run: python3 -m unittest discover -s deploy -p 'test_monitoring_sql.py' -v

      - name: Reproduce and verify subsidy cache default-ACL repair
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cipherscan_ci
        run: python3 -m unittest discover -s deploy -p 'test_subsidy_allocation_privileges.py' -v

      - name: cargo build --locked --release
        run: cargo build --locked --release

      - name: cargo test --locked --release
        env:
          DATABASE_URL: postgres://zcash_user:zcash_test@localhost:5432/cipherscan_ci
        run: cargo test --locked --release -- --test-threads=4

      - name: Publish the tested indexer binary
        uses: actions/upload-artifact@v4
        with:
          name: cipherscan-indexer-linux-x86_64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/release/cipherscan-indexer
          if-no-files-found: error
          retention-days: 7

  monitoring:
    name: monitoring configs (promtool + amtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned promtool and amtool (SHA-256 verified)
        run: |
          set -euo pipefail
          source deploy/monitoring/versions.env
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSLo prometheus.tar.gz "$PROMETHEUS_URL"
          curl -fsSLo alertmanager.tar.gz "$ALERTMANAGER_URL"
          echo "$PROMETHEUS_SHA256  prometheus.tar.gz" | sha256sum -c -
          echo "$ALERTMANAGER_SHA256  alertmanager.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz --strip-components=1 --wildcards '*/promtool'
          tar xzf alertmanager.tar.gz --strip-components=1 --wildcards '*/amtool'
          ./promtool --version
          ./amtool --version
      - name: Validate Prometheus, rules, rule unit tests, Alertmanager and dashboard
        env:
          PROMTOOL: ${{ runner.temp }}/tools/promtool
          AMTOOL: ${{ runner.temp }}/tools/amtool
        run: bash deploy/monitoring/validate.sh
      - name: Monitoring unit tests
        run: python3 -m unittest deploy/test_monitoring.py -v
